# ── General ──────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g history-limit 50000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "#S / #W"
set -g focus-events on
set -sg escape-time 0

# ── Prefix ───────────────────────────────────────
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# ── Extended keys (pass Shift+Enter etc. through to apps) ──
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -as terminal-features 'xterm-ghostty:extkeys'

# ── Splits ───────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# ── Navigation ───────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Resize ───────────────────────────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Reload ───────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# ── Status Bar (Snazzy-inspired) ─────────────────
set -g status-position top
set -g status-interval 5
set -g status-style "bg=#282a36,fg=#eff0eb"
set -g status-left-length 40
set -g status-right-length 60
set -g status-left "#[fg=#282a36,bg=#57c7ff,bold]  #S #[fg=#57c7ff,bg=#282a36] "
set -g status-right "#[fg=#606580] %H:%M #[fg=#eff0eb]│ #[fg=#5af78e]#(whoami) "

# ── Window tabs ──────────────────────────────────
setw -g window-status-format "#[fg=#606580] #I:#W "
setw -g window-status-current-format "#[fg=#282a36,bg=#ff6ac1,bold] #I:#W #[fg=#ff6ac1,bg=#282a36]"
setw -g window-status-separator ""

# ── Pane borders ─────────────────────────────────
set -g pane-border-style "fg=#3a3d4d"
set -g pane-active-border-style "fg=#57c7ff"

# ── Messages ─────────────────────────────────────
set -g message-style "bg=#57c7ff,fg=#282a36,bold"
