# Settings common to every platform.
#
# Not loaded directly — the per-OS entry points (config on macOS, linux.conf
# on Linux) pull this in with `config-file = shared.conf`. Ghostty resolves
# that relative path against the directory of the config file *as given*, so
# this file must be symlinked next to whichever entry point is in use. Both
# setup/link.zsh and setup/linux.zsh do that.

background                  = 000000
cursor-style                = block

# The empty value clears Ghostty's default list before appending, otherwise
# the fallback fonts stay ahead of the one we actually want.
font-family                 =
font-family                 = MonaspiceNe NFM Light

# Prevent shell integration from forcing the cursor to `block`
shell-integration-features  = no-cursor

window-padding-x            = 4
window-padding-y            = 2
