# Linux entry point. setup/linux.zsh symlinks this to ~/.config/ghostty/config
# (note the rename — Ghostty only ever reads a file called `config`).
#
# macOS uses the `config` file in this directory instead; anything belonging
# to both goes in shared.conf.

config-file                 = shared.conf

# Translucency plus compositor blur. Ghostty only needs to be transparent —
# Hyprland does the actual blurring (decoration.blur in hypr/config).
# Rosé Pine base as the glass tint: shared.conf sets background = 000000 for
# macOS, but here the compositor blur does the smoking, so tint instead.
background                  = 191724
background-opacity          = 0.78
background-blur             = true

# Chromeless: Hyprland is a tiling compositor and draws no titlebar, so any
# chrome here would be Ghostty's own client-side decoration.
window-decoration           = false

# Generated by noctalia from the current wallpaper into
# ~/.config/ghostty/themes/noctalia. That file is machine state and is
# deliberately not tracked in this repo.
theme                       = noctalia

# No macos-* keys, no window-colorspace, and no `global:` keybind here:
# Ghostty warns on unknown/unsupported keys, and global hotkeys belong to
# the compositor on Wayland. Stock Linux keybinds (ctrl+shift+*) on purpose —
# custom binds got confusing fast; revisit once the layout feels native.
