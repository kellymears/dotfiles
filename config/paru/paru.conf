# paru (Arch/CachyOS AUR helper). System defaults are in /etc/paru.conf; this
# file only overrides.
[options]
# Skip the PKGBUILD diff/review pager on every AUR build. The prompt is where
# installs kept stalling ("(END)" in less). Trade-off: PKGBUILDs are not
# eyeballed before building, so stick to well-known AUR packages.
SkipReview
